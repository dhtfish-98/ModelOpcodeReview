name: model-opcode-review
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned build and test tools
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
      - name: Complete tests and source checks
        run: |
          python -m pytest -q
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Build and verify own artifacts
        run: |
          python -m build --no-isolation
          python scripts/verify_package.py dist/model_opcode_review-0.1.2-py3-none-any.whl dist/model_opcode_review-0.1.2.tar.gz
      - name: Independent offline installation and real CLI checks
        run: |
          python -m venv .install-check
          .install-check/bin/python -m pip install --no-index --no-deps dist/model_opcode_review-0.1.2-py3-none-any.whl
          .install-check/bin/python -m pip check
          .install-check/bin/python scripts/installed_cli_check.py
          .install-check/bin/python scripts/installed_smoke.py dist/model_opcode_review-0.1.2-py3-none-any.whl
